<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Clients inscrits — MatDiagnostics</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f3f6fb;color:#1b2a41;margin:0;padding:18px}
h2{margin:0;color:#0b3d91}.err{color:#b00;min-height:1.2em}
button{padding:9px 14px;border:0;border-radius:8px;cursor:pointer;font-size:.95rem;background:#0b3d91;color:#fff}
button.sec{background:#e4e9f3;color:#1b2a41}button.del{background:#c62828}button:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{padding:9px;border:1px solid #c5cfdf;border-radius:8px;min-width:220px;flex:1;max-width:340px}
.wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001}
table{border-collapse:collapse;width:100%;min-width:760px}
th{background:#0b3d91;color:#fff;text-align:left;padding:11px 10px;font-size:.9rem;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #e6ebf4;font-size:.93rem;vertical-align:top}
tr:nth-child(even) td{background:#f8faff}tr:hover td{background:#eef3ff}
.num{font-weight:700;color:#0b3d91}.prix{white-space:nowrap;font-weight:600}.dt{white-space:nowrap;color:#52607a}
.empty{padding:26px;text-align:center;color:#52607a}#info{margin:10px 2px;color:#52607a;font-size:.9rem}

#login[hidden]{display:none}
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;
 background:radial-gradient(900px 500px at 15% 10%,#1e5bd6 0%,transparent 60%),radial-gradient(700px 480px at 90% 95%,#16a34a55 0%,transparent 60%),linear-gradient(160deg,#071e4a,#0b3d91 60%,#0a2f70)}
#login::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.lcard{position:relative;width:100%;max-width:400px;background:#fff;border-radius:20px;padding:34px 30px 28px;box-shadow:0 30px 70px #00000055}
.lcard.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lico{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0b3d91,#1e6bff);display:flex;align-items:center;justify-content:center;margin:-64px auto 16px;box-shadow:0 12px 28px #0b3d9166;border:4px solid #fff}
.lcard h2{text-align:center;font-size:1.45rem;color:#0b2a63;margin:0 0 4px}
.lsub{text-align:center;color:#5b6b88;font-size:.95rem;margin:0 0 22px}
.lf{display:block;font-size:.88rem;font-weight:600;color:#33425f;margin-bottom:6px}
.inp{position:relative;margin-bottom:16px}
.inp svg.i{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none}
#login input{width:100%;padding:13px 44px 13px 42px;margin:0;border:1.5px solid #d3dbea;border-radius:12px;font-size:1rem;background:#f7f9fd;color:#1b2a41;transition:border-color .15s,box-shadow .15s,background .15s}
#login input:focus{outline:none;border-color:#1e6bff;background:#fff;box-shadow:0 0 0 4px #1e6bff22}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;padding:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center}
#eye:hover{background:#e8eefb}#eye:focus-visible{outline:2px solid #1e6bff}
#login .err{display:none;background:#fdecec;border:1px solid #f5b5b5;color:#9b1c1c;border-radius:10px;padding:10px 12px;font-size:.92rem;margin:0 0 16px;min-height:0}
#login .err.on{display:block}
#b{width:100%;padding:14px;font-size:1.02rem;font-weight:600;border-radius:12px;background:linear-gradient(135deg,#0b3d91,#1e6bff);box-shadow:0 8px 20px #0b3d9155;transition:transform .12s,box-shadow .12s,opacity .12s}
#b:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px #0b3d9166}
#b:focus-visible{outline:3px solid #9cc0ff;outline-offset:2px}
.lfoot{text-align:center;color:#7a889f;font-size:.82rem;margin:18px 0 0}
@media (prefers-reduced-motion:reduce){.lcard.shake{animation:none}#b{transition:none}}
</style></head><body>

<div id="login"><div class="lcard" id="lc">
  <div class="lico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3z"/><rect x="9" y="10.5" width="6" height="5" rx="1"/><path d="M10.5 10.5V9a1.5 1.5 0 0 1 3 0v1.5"/></svg></div>
  <h2>Espace administrateur</h2>
  <p class="lsub">MatDiagnostics Solution</p>
  <p class="err" id="e" role="alert"></p>
  <label class="lf" for="em">Adresse email</label>
  <div class="inp"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a889f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    <input id="em" type="email" placeholder="vous@exemple.com" autocomplete="username"></div>
  <label class="lf" for="pw">Mot de passe</label>
  <div class="inp"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a889f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
    <input id="pw" type="password" placeholder="Votre mot de passe" autocomplete="current-password">
    <button type="button" id="eye" aria-label="Afficher le mot de passe"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b6b88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <button id="b">Se connecter</button>
  <p class="lfoot">Accès réservé à l'administrateur du site.</p>
</div></div>

<div id="app" hidden>
  <div class="top"><h2>Clients inscrits (<span id="t">0</span>)</h2>
    <div><button class="sec" id="rf">Actualiser</button> <button class="sec" id="lo">Déconnexion</button></div></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Rechercher (nom, téléphone, adresse, service)…">
    <button class="del" id="ds" disabled>Supprimer la sélection (0)</button>
  </div>
  <div class="wrap"><table>
    <thead><tr><th><input type="checkbox" id="all" title="Tout sélectionner"></th><th>N°</th><th>Inscrit le</th><th>Nom et prénoms</th><th>Téléphone</th><th>Adresse</th><th>Carte</th><th>Service</th><th>Prix</th><th></th></tr></thead>
    <tbody id="tb"></tbody></table><div class="empty" id="empty" hidden>Aucun client à afficher.</div></div>
  <div id="info"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let rows = [], selected = new Set();
const fmtDate = d => new Date(d).toLocaleString('fr-FR', {timeZone:'Africa/Porto-Novo', dateStyle:'short', timeStyle:'short'});
const cell = (tr, txt, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = txt; tr.appendChild(td); return td; };

function showErr(t){ const e=$('e'); e.textContent=t||''; e.classList.toggle('on',!!t); if(t){ const c=$('lc'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); } }
function showLogin(msg){ $('login').hidden = false; $('app').hidden = true; showErr(msg); }

async function load(){
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return showLogin();
  const {data, error} = await sb.from('clients').select('*').order('created_at', {ascending:false});
  if (error) return showLogin('Erreur : ' + error.message);
  rows = data; selected.clear();
  $('login').hidden = true; $('app').hidden = false;
  render();
}

function render(){
  const q = $('q').value.trim().toLowerCase();
  const total = rows.length;
  $('t').textContent = total;
  const tb = $('tb'); tb.innerHTML = '';
  let shown = 0;
  rows.forEach((r, i) => {
    const hay = [r.nom, r.telephone, r.adresse, r.service].join(' ').toLowerCase();
    if (q && !hay.includes(q)) return;
    shown++;
    const tr = document.createElement('tr');
    const tdc = document.createElement('td'); const cb = document.createElement('input'); cb.type = 'checkbox';
    cb.checked = selected.has(r.id);
    cb.onchange = () => { cb.checked ? selected.add(r.id) : selected.delete(r.id); updSel(); };
    tdc.appendChild(cb); tr.appendChild(tdc);
    cell(tr, total - i, 'num'); cell(tr, fmtDate(r.created_at), 'dt');
    cell(tr, r.nom); cell(tr, r.telephone); cell(tr, r.adresse);
    const tdm = document.createElement('td');
    if (r.latitude != null && r.longitude != null) {
      const a2 = document.createElement('a'); a2.href = 'https://www.google.com/maps?q=' + r.latitude + ',' + r.longitude; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = '📍 Voir sur la carte';
      tdm.appendChild(a2);
    } else { tdm.textContent = '—'; tdm.style.color = '#9aa6bb'; }
    tr.appendChild(tdm);
    cell(tr, r.service);
    cell(tr, fmtPrice(r.prix), 'prix');
    const tdd = document.createElement('td'); const bt = document.createElement('button');
    bt.className = 'del'; bt.textContent = 'Supprimer';
    bt.onclick = () => remove([r.id], 'Supprimer le client « ' + r.nom + ' » ?');
    tdd.appendChild(bt); tr.appendChild(tdd); tb.appendChild(tr);
  });
  $('empty').hidden = shown > 0;
  $('info').textContent = shown + ' client(s) affiché(s) sur ' + total + '.';
  updSel();
}

function updSel(){
  $('ds').textContent = 'Supprimer la sélection (' + selected.size + ')';
  $('ds').disabled = selected.size === 0;
  const boxes = [...document.querySelectorAll('#tb input[type=checkbox]')];
  $('all').checked = boxes.length > 0 && boxes.every(c => c.checked);
}

async function remove(ids, question){
  if (!confirm(question + '\nCette action est définitive.')) return;
  const {data, error} = await sb.from('clients').delete().in('id', ids).select('id');
  if (error) return alert('Erreur : ' + error.message);
  if (!data || data.length === 0) return alert("Rien n'a été supprimé. Relancez le script des règles (policies) dans Supabase.");
  rows = rows.filter(r => !ids.includes(r.id)); ids.forEach(i => selected.delete(i));
  render();
}

$('ds').onclick = () => remove([...selected], 'Supprimer ' + selected.size + ' client(s) sélectionné(s) ?');
$('all').onchange = e => {
  document.querySelectorAll('#tb tr').forEach((tr, idx) => {});
  const q = $('q').value.trim().toLowerCase();
  rows.forEach(r => {
    const hay = [r.nom, r.telephone, r.adresse, r.service].join(' ').toLowerCase();
    if (!q || hay.includes(q)) e.target.checked ? selected.add(r.id) : selected.delete(r.id);
  });
  render();
};
$('q').oninput = render;
$('rf').onclick = load;
$('lo').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('eye').onclick = () => { const p=$('pw'), show=p.type==='password'; p.type=show?'text':'password'; $('eye').setAttribute('aria-label', show?'Masquer le mot de passe':'Afficher le mot de passe'); };
$('b').onclick = async () => {
  showErr('');
  if (!$('em').value.trim() || !$('pw').value) return showErr('❌ Saisissez votre email et votre mot de passe.');
  $('b').disabled = true; $('b').textContent = 'Connexion…';
  const {error} = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
  $('b').disabled = false; $('b').textContent = 'Se connecter';
  if (error) {
    const m = (error.message||'').toLowerCase();
    showErr(m.includes('invalid login') ? '❌ Email ou mot de passe incorrect. Réessayez.' : '❌ Connexion impossible : ' + error.message);
    $('pw').value = ''; $('pw').focus();
  } else load();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('b').click(); });
load();
</script></body></html>
